<!-- =========================================================
       TELEGRAM QR CODE MODAL
  ========================================================== -->
  <div id="telegramQrModal" 
       class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 opacity-0 pointer-events-none transition-all duration-300 ease-out"
       role="dialog"
       aria-modal="true"
       aria-labelledby="telegramQrTitle">
    
    <!-- Backdrop with blur -->
    <div class="modal-backdrop absolute inset-0 bg-zinc-950/80 backdrop-blur-md transition-opacity"></div>

    <!-- Scaled & Centered Modal Dialog -->
    <div id="telegramQrContent" 
         class="relative w-full max-w-sm sm:max-w-md bg-white dark:bg-surface rounded-3xl border border-zinc-200 dark:border-zinc-800 shadow-2xl p-6 sm:p-8 z-10 transform scale-90 opacity-0 transition-all duration-300 ease-out">
      
      <!-- Close button (top right) -->
      <button type="button" id="closeTelegramQrBtn" class="absolute top-4 right-4 p-2 rounded-xl text-zinc-400 hover:text-zinc-600 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" aria-label="Close Telegram QR modal">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Header info -->
      <div class="text-center space-y-2 mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-sky-500/10 text-sky-500 dark:bg-sky-500/20 mb-1">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.921z"/>
          </svg>
        </div>
        <h3 id="telegramQrTitle" class="font-display text-xl font-bold text-zinc-950 dark:text-white">
          Scan to Chat on Telegram
        </h3>
        <p class="text-xs text-zinc-500 dark:text-zinc-400">
          Scan with your phone's camera or Telegram app to connect directly
        </p>
      </div>

      <!-- QR Container -->
      <div class="relative mx-auto w-56 h-56 sm:w-60 sm:h-60 p-4 rounded-2xl bg-white border border-zinc-200 dark:border-zinc-700/80 shadow-inner flex items-center justify-center">
        <img id="telegramQrImage" 
             src="profile/telegram-qr.svg" 
             alt="Telegram QR Code for @majesty_fury" 
             class="w-full h-full object-contain rounded-xl select-none no-lightbox" />
        
        <!-- Telegram Badge Overlay in Center -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="w-10 h-10 rounded-full bg-white dark:bg-zinc-900 p-1.5 shadow-md border border-zinc-200 dark:border-zinc-700 flex items-center justify-center">
            <svg class="w-5 h-5 text-sky-500" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.921z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Username & Action Buttons inside modal -->
      <div class="mt-6 space-y-3">
        <div class="flex items-center justify-between px-4 py-2.5 rounded-xl bg-zinc-50 dark:bg-zinc-800/60 border border-zinc-200/80 dark:border-zinc-700/60">
          <div class="flex items-center gap-2 min-w-0">
            <span class="font-mono text-xs text-zinc-400">Handle:</span>
            <span class="font-mono text-xs font-semibold text-zinc-900 dark:text-zinc-100 truncate">@majesty_fury</span>
          </div>
          <button type="button" id="modalCopyTelegramBtn" class="shrink-0 text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300">
            Copy
          </button>
        </div>

        <a href="https://t.me/majesty_fury" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-medium text-sm transition-colors shadow-sm active:scale-[0.98]">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.921z"/>
          </svg>
          <span>Open in Telegram (@majesty_fury)</span>
        </a>
      </div>

    </div>
  </div>

  <!-- =========================================================
       IMAGE LIGHTBOX MODAL (SCALE & CENTER IN VIEWPORT WITH GRAY BACKDROP)
  ========================================================== -->
  <div id="imageModal" 
       class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-300 ease-out cursor-zoom-out select-none"
       role="dialog"
       aria-modal="true"
       aria-label="Image preview">
    
    <!-- Top-Right Floating Hint Pill -->
    <div class="absolute top-4 right-4 sm:top-6 sm:right-6 z-20 flex items-center gap-2 px-3.5 py-2 rounded-full bg-zinc-800/90 text-zinc-200 border border-zinc-700/80 shadow-lg text-xs font-mono backdrop-blur-md transition-all pointer-events-none">
      <span class="hidden sm:inline text-zinc-300">Click anywhere to close</span>
      <span class="sm:hidden text-zinc-300">Close</span>
      <kbd class="hidden sm:inline-block px-1.5 py-0.5 rounded bg-zinc-900/80 text-[10px] text-zinc-400 border border-zinc-700">ESC</kbd>
      <svg class="w-4 h-4 text-zinc-300 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>

    <!-- Scaled & Centered Image Container -->
    <div id="imageModalContent" 
         class="relative max-w-4xl max-h-[85vh] flex flex-col items-center justify-center transform scale-90 opacity-0 transition-all duration-300 ease-out">
      <img id="imageModalImg" 
           src="" 
           alt="Preview" 
           class="max-w-[92vw] max-h-[80vh] md:max-w-2xl lg:max-w-3xl w-auto h-auto object-contain rounded-2xl shadow-2xl border border-white/10 dark:border-zinc-700/80 ring-1 ring-white/10 cursor-zoom-out" />
      <p id="imageModalCaption" class="hidden mt-3 text-xs font-mono text-zinc-300 text-center bg-zinc-950/70 backdrop-blur-sm px-3.5 py-1.5 rounded-full border border-zinc-800/90 shadow-md"></p>
    </div>
  </div>

  <!-- =========================================================
       TOAST NOTIFICATION CONTAINER
  ========================================================== -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
    <div class="flex items-center gap-3 px-4 py-3 rounded-2xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-xl text-sm font-medium text-zinc-900 dark:text-zinc-100">
      <span class="flex items-center justify-center w-6 h-6 rounded-full bg-emerald-500/15 text-emerald-500">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </span>
      <span id="toastMessage">Action completed</span>
    </div>
  </div>
