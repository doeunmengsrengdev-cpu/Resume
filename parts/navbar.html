<!-- =========================================================
       1. STICKY NAVIGATION BAR (WITH HOVER & ACTIVE UNDERLINE)
  ========================================================== -->
  <header id="navbar" class="sticky top-0 z-40 w-full border-b border-zinc-200/80 dark:border-zinc-800/70 bg-white/80 dark:bg-obsidian/80 backdrop-blur-xl transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Brand Mark -->
      <div class="flex items-center gap-2.5">
        <button type="button" 
                id="brandAvatarBtn" 
                aria-label="View profile photo full size" 
                title="Click to view full photo" 
                class="flex items-center justify-center w-9 h-9 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-950 font-display font-bold text-sm tracking-tight shadow-sm hover:ring-2 hover:ring-indigo-500/80 hover:scale-105 active:scale-95 transition-all cursor-zoom-in focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <img src="./profile/pf.PNG" alt="Doune Memgsreng profile" class="w-7 h-7 rounded-full object-cover pointer-events-none" />
        </button>
        <a href="#top" class="group hidden sm:flex flex-col leading-none focus:outline-none">
          <span class="font-display font-semibold text-sm tracking-tight text-zinc-900 dark:text-zinc-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">Doune Memgsreng</span>
          <span class="font-mono text-[10px] text-zinc-500 dark:text-zinc-400 mt-0.5">Full-Stack Developer</span>
        </a>
      </div>

      <!-- Desktop Navigation Links (with animated hover & active underline) -->
      <nav aria-label="Primary" class="hidden md:flex items-center gap-1.5" id="desktopNav">
        <a href="#work" class="nav-link">Work</a>
        <a href="#process" class="nav-link">Process</a>
        <a href="#stack" class="nav-link">Stack</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <!-- Right Controls: Theme Toggle + CTA + Mobile Menu -->
      <div class="flex items-center gap-2.5">
        <!-- Theme Toggle Button -->
        <button id="themeToggle" type="button" aria-label="Toggle Dark and Light Mode" class="p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-100/70 dark:bg-zinc-900/80 text-zinc-700 dark:text-zinc-300 hover:border-indigo-500/50 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all">
          <!-- Sun Icon (shown in dark mode) -->
          <svg id="iconSun" class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Moon Icon (shown in light mode) -->
          <svg id="iconMoon" class="w-4 h-4 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <!-- Desktop CTA -->
        <a href="#contact" class="hidden sm:inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-950 text-sm font-medium hover:bg-indigo-600 dark:hover:bg-indigo-400 dark:hover:text-zinc-950 transition-all shadow-sm">
          <span>Let's Talk</span>
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
          </svg>
        </a>

        <!-- Mobile Menu Button -->
        <button id="mobileMenuBtn" type="button" aria-label="Open navigation menu" aria-expanded="false" class="md:hidden p-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-100/70 dark:bg-zinc-900/80 text-zinc-700 dark:text-zinc-300">
          <svg id="menuIconOpen" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg id="menuIconClose" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobileDrawer" class="hidden md:hidden border-t border-zinc-200 dark:border-zinc-800 bg-white/95 dark:bg-obsidian/95 backdrop-blur-xl px-4 pt-3 pb-5 space-y-1.5">
      <a href="#work" class="mobile-nav-link block px-3.5 py-2.5 rounded-xl text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800/70">Work</a>
      <a href="#process" class="mobile-nav-link block px-3.5 py-2.5 rounded-xl text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800/70">Process</a>
      <a href="#stack" class="mobile-nav-link block px-3.5 py-2.5 rounded-xl text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800/70">Stack</a>
      <a href="#about" class="mobile-nav-link block px-3.5 py-2.5 rounded-xl text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800/70">About</a>
      <a href="#contact" class="mobile-nav-link block px-3.5 py-2.5 rounded-xl text-base font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800/70">Contact</a>
      <div class="pt-2">
        <a href="#contact" class="flex items-center justify-center gap-2 w-full px-4 py-3 rounded-xl bg-indigo-600 text-white text-sm font-medium">
          Let's Talk
        </a>
      </div>
    </div>
  </header>
